name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: |
          if [ -d test ]; then
            flutter test --reporter expanded
          else
            echo "No tests directory — skipping tests"
          fi

  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
            storePassword=$ANDROID_KEYSTORE_PASSWORD
            keyPassword=$ANDROID_KEY_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            storeFile=keystore.jks
          EOF

      - name: Generate temporary dummy signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkeypair -alias ci-debug-key -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore android/app/keystore.jks -storepass android -keypass android \
            -dname "CN=Dummy, OU=CI, O=Belegscanner, L=Berlin, ST=Berlin, C=DE"
          cat > android/key.properties <<EOF
            storePassword=android
            keyPassword=android
            keyAlias=ci-debug-key
            storeFile=keystore.jks
          EOF

      - name: Extract app version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/belegscanner-${{ steps.version.outputs.version }}-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: belegscanner-${{ steps.version.outputs.version }}-release
          path: build/app/outputs/flutter-apk/belegscanner-${{ steps.version.outputs.version }}-release.apk
